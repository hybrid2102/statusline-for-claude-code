<svg xmlns="http://www.w3.org/2000/svg" width="1316" height="244" viewBox="0 0 1316 244" role="img" aria-label="Three examples of the status line: all is well, something needs attention, and a narrow terminal">
  <style>
    .caption { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #7d8590; }
    .line { font: 14px ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; }
  </style>
  <rect x="0.5" y="0.5" width="1315" height="243" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5" fill="#febc2e"/>
  <circle cx="56" cy="20" r="5" fill="#28c840"/>
  <text x="24" y="58" class="caption">All is well: grey everywhere, the budget light is green</text>
  <text x="24" y="86" class="line" xml:space="preserve"><tspan fill="#e6edf3">🔖 refactor billing</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">📁 acme-web</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🌿 main </tspan><tspan fill="#7d8590">*3</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🤖 Opus 5.5</tspan><tspan fill="#7d8590"> · high</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🧠 111k </tspan><tspan fill="#7d8590">11%</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🟢 </tspan><tspan fill="#7d8590">5h</tspan><tspan fill="#e6edf3"> 20%</tspan><tspan fill="#7d8590">→</tspan><tspan fill="#e6edf3">40%</tspan><tspan fill="#7d8590"> ↺2h30m</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">7d</tspan><tspan fill="#e6edf3"> 25%</tspan><tspan fill="#7d8590">→</tspan><tspan fill="#e6edf3">51%</tspan><tspan fill="#7d8590"> ↺3d13h</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">👤 </tspan><tspan fill="#7d8590">dev</tspan></text>
  <text x="24" y="122" class="caption">Something needs attention: a rebase left half-way, a heavy context with a cold cache, a week burning too fast</text>
  <text x="24" y="150" class="line" xml:space="preserve"><tspan fill="#e6edf3">🔖 refactor billing</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">📁 acme-web</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🌿 main </tspan><tspan fill="#7d8590">*9</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">REBASE</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🤖 Opus 5.5 </tspan><tspan fill="#e3b341">⚡</tspan><tspan fill="#7d8590"> · high</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🧠 </tspan><tspan fill="#e3b341">310k</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7d8590">31%</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">❄ 310k</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🔴 </tspan><tspan fill="#7d8590">5h</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">30%</tspan><tspan fill="#7d8590">→</tspan><tspan fill="#e3b341">75%</tspan><tspan fill="#7d8590"> ↺3h00m</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#7d8590">7d</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">50%</tspan><tspan fill="#7d8590">→</tspan><tspan fill="#ff7b72">175%</tspan><tspan fill="#7d8590"> ↺5d0h</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">👤 </tspan><tspan fill="#7d8590">dev</tspan></text>
  <text x="24" y="186" class="caption">A narrow terminal: segments shorten first, the budget stays</text>
  <text x="24" y="214" class="line" xml:space="preserve"><tspan fill="#e6edf3">📁 acme-web</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🤖 Opus 5.5</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🧠 11%</tspan><tspan fill="#7d8590"> │ </tspan><tspan fill="#e6edf3">🟢 </tspan><tspan fill="#7d8590">7d</tspan><tspan fill="#e6edf3"> 25%</tspan><tspan fill="#7d8590">→</tspan><tspan fill="#e6edf3">51%</tspan><tspan fill="#7d8590"> ↺3d13h</tspan></text>
</svg>
