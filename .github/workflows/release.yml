name: Release

# Publishing is done by CI, not by hand on a maintainer's machine: the package is then
# reproducible from a known commit, and every release carries checksums produced by the
# same pipeline that tested it.
#
# To cut a release: update CHANGELOG.md and the version in statusline.mjs and
# package.json, commit, then push an annotated tag (v1.2.3).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build the release for, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF -replace '^refs/tags/', '' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Unexpected tag format: '$tag'" }
          "tag=$tag"                       | Out-File $env:GITHUB_OUTPUT -Append
          "version=$($tag.TrimStart('v'))" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $tag"

      - name: Verify the tag, the script, package.json and the changelog agree
        shell: pwsh
        run: |
          # The installer decides whether it may overwrite an installed copy by comparing the
          # "// version:" line, so a release whose script carries the wrong version would
          # either refuse to upgrade or silently downgrade. This is the last cheap moment to
          # catch it.
          $expected = '${{ steps.version.outputs.version }}'
          $script = (Select-String -Path ./statusline.mjs -Pattern '^// version: (\d+\.\d+\.\d+)$').Matches[0].Groups[1].Value
          $package = (Get-Content ./package.json -Raw | ConvertFrom-Json).version
          if ($script -ne $expected) { throw "statusline.mjs says $script but the tag says $expected." }
          if ($package -ne $expected) { throw "package.json says $package but the tag says $expected." }
          $changelog = Get-Content ./CHANGELOG.md -Raw
          if ($changelog -notmatch "(?m)^##\s*\[$([regex]::Escape($expected))\]") {
            throw "CHANGELOG.md has no '## [$expected]' section. Document the release before tagging it."
          }
          Write-Host "Version $expected is consistent everywhere."

      - name: Run the tests once more on the tagged commit
        run: npm test

      - name: Build the package
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'statusline-for-claude-code'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          # Only what an end user needs: the tests, CI config and contributor docs stay in
          # the repository.
          $payload = @(
            'statusline.mjs'
            'install.ps1'
            'install.bat'
            'claude-profile.bat'
            'README.md'
            'CHANGELOG.md'
            'SECURITY.md'
            'LICENSE'
          )
          Copy-Item $payload -Destination $staging

          New-Item -ItemType Directory -Path ./dist -Force | Out-Null
          $zip = "./dist/statusline-for-claude-code-${{ steps.version.outputs.tag }}.zip"
          Compress-Archive -Path $staging -DestinationPath $zip

          # Checksums for the package, and for the script on its own so a manual install on
          # macOS or Linux can be verified without unpacking anything.
          Copy-Item ./statusline.mjs ./dist/statusline.mjs
          $lines = foreach ($file in @($zip, './dist/statusline.mjs')) {
            $hash = Get-FileHash -LiteralPath $file -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), (Split-Path $file -Leaf)
          }
          $lines | Set-Content ./dist/SHA256SUMS.txt -Encoding ascii
          Get-Content ./dist/SHA256SUMS.txt | Write-Host

      - name: Verify the package installs and runs
        shell: pwsh
        run: |
          # Unpack the zip that is about to be published and run its installer against
          # throwaway folders: a package that cannot install itself must never reach users.
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive "./dist/statusline-for-claude-code-${{ steps.version.outputs.tag }}.zip" -DestinationPath $unpacked
          $root = Join-Path $unpacked 'statusline-for-claude-code'
          $entries = @(Get-ChildItem $root)
          if ($entries.Count -ne 8) { throw "Expected 8 files in the package, found $($entries.Count)." }

          $scriptDir = Join-Path $env:RUNNER_TEMP 'probe-script'
          $configDir = Join-Path $env:RUNNER_TEMP 'probe-profile'
          & (Join-Path $root 'install.ps1') -ScriptDir $scriptDir -ConfigDir $configDir -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "The packaged installer failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path (Join-Path $configDir 'settings.json'))) { throw 'The installer did not write settings.json.' }
          Write-Host 'The package installs and runs.'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $notes = "See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed in this version.`n`n" +
                   "**Windows:** unzip, then double-click ``install.bat``.`n" +
                   "**macOS / Linux:** download ``statusline.mjs`` and follow the [manual install](https://github.com/${{ github.repository }}#macos-and-linux).`n`n" +
                   "Verify your download against ``SHA256SUMS.txt``:`n`n" +
                   '```powershell' + "`n" +
                   "Get-FileHash .\statusline-for-claude-code-$tag.zip -Algorithm SHA256`n" +
                   '```' + "`n`nBuilt by CI from ``$($env:GITHUB_SHA)``."
          $notes | Set-Content ./dist/notes.md -Encoding utf8

          $assets = @("./dist/statusline-for-claude-code-$tag.zip", './dist/statusline.mjs', './dist/SHA256SUMS.txt')
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --notes-file ./dist/notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "gh exited with $LASTEXITCODE." }

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: ./dist/
